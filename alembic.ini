# ===== Alembic Configuration =====
# Campus Buddy - Database Migration

[alembic]
# path to migration scripts
script_location = alembic

# sys.path prepend so app package is importable
prepend_sys_path = .

# sqlalchemy.url is set dynamically in alembic/env.py from app.core.config
# so it respects the .env file and environment variables.
# sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
