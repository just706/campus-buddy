# Render 后端部署配置
# 在 Render 上选择 "Blueprint" 一键部署，或者手动创建 Web Service

services:
  - type: web
    name: campus-buddy-api
    runtime: python
    plan: free  # 免费套餐

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: APP_NAME
        value: CampusBuddy
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true  # 自动生成随机密钥
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./campus_buddy.db
      - key: CORS_ORIGINS
        value: '["*"]'
      # === AI 配置（使用 DeepSeek）===
      # 部署后需要在 Render 面板填入你的 API Key
      - key: PDAI_BASE_URL
        value: https://api.deepseek.com
      - key: PDAI_API_KEY
        sync: false  # 部署后手动填写，避免提交到 git
        value: sk-your-deepseek-api-key
      - key: PDAI_MODEL
        value: deepseek-chat
